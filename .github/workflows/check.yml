name: precision-bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # every 15 min, offset 3 min off quarter-hours to dodge GH scheduler congestion
  workflow_dispatch: {}

permissions:
  contents: write   # to commit updated state/state.json

concurrency:
  group: precision-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m precision_bot.cli --config config/symbols.yaml --state state/state.json

      - name: Commit state changes
        run: |
          if ! git diff --quiet -- state/state.json; then
            git config user.name  "precision-bot[bot]"
            git config user.email "precision-bot[bot]@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore(state): update [skip ci]"
            git push
          fi
