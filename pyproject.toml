[project]
name = "precision-bot"
version = "0.1.0"
description = "Telegram alert bot for the Precision Sniper indicator on crypto markets."
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
precision-bot = "precision_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precision_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
